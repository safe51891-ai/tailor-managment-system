<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';"><title>Welcome to Tailor Shop</title>
<style>body{background:#f5f3ed;color:#19333b;font:16px system-ui;margin:0;padding:40px}main{max-width:460px;margin:auto}h1{font-size:28px}p{line-height:1.6;color:#52676c}label{display:block;font-weight:650;margin:18px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #8baba6;border-radius:7px;font:inherit}button{margin-top:24px;background:#176959;color:white;border:0;border-radius:7px;padding:14px;width:100%;font:700 16px system-ui;cursor:pointer}input:focus,button:focus-visible{outline:3px solid #b79351;outline-offset:3px}#error{color:#b42318}small{display:block;margin-top:6px;color:#52676c}</style></head>
<body><main><h1>Welcome to Tailor Shop</h1><p>Create the account you will use to sign in. Your shop data stays on this computer.</p>
<form id="setup"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required maxlength="100">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required pattern="[A-Za-z0-9_.\-]{3,50}"><small>3–50 letters, numbers, dots, hyphens or underscores.</small>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
<label for="password_confirmation">Confirm password</label><input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
<p id="error" role="alert"></p><button type="submit">Create account &amp; open shop</button></form><button type="button" id="restore-backup">Restore an existing shop backup</button></main><script src="setup.js"></script></body></html>
